<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Salary Pulse — Calendrier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="calendar.css">
</head>
<body data-sp-page="calendar" data-sp-hud="auto">
    <div class="sp-app-container">
        <header class="sp-header" data-sp-header="module"></header>

        <main class="cal-main">
            <h1 class="sp-sr-only">Calendrier</h1>

            <!-- Jour actuel : chiffre monumental sur pan rouge déchiré -->
            <section class="cal-today" aria-label="Jour actuel">
                <div class="cal-today-block">
                    <span class="cal-dow" id="calTodayDow">—</span>
                    <span class="cal-today-num sp-glitch" id="calTodayNum">--</span>
                    <span class="cal-today-month" id="calTodayMonth">—</span>
                </div>
                <p class="cal-today-info" id="calTodayInfo"></p>

                <div class="cal-detail sp-slab sp-slab--black" id="calDetail" aria-live="polite">
                    <span class="cal-detail-tag">JOUR SÉLECTIONNÉ</span>
                    <span class="cal-detail-date" id="calDetailDate">—</span>
                    <span class="cal-detail-kind" id="calDetailKind">—</span>
                    <dl class="cal-detail-rows">
                        <div><dt>HORAIRES</dt><dd id="calDetailHours">—</dd></div>
                        <div><dt>SALAIRE</dt><dd id="calDetailAmount">—</dd></div>
                    </dl>
                </div>
            </section>

            <!-- Grille du mois -->
            <section class="cal-board" aria-labelledby="calTitle">
                <div class="cal-toolbar">
                    <button type="button" class="cal-nav sp-slab sp-slab--white" id="calPrev" aria-label="Mois précédent">◀</button>
                    <h2 class="cal-title" id="calTitle" data-ransom>CALENDRIER</h2>
                    <button type="button" class="cal-nav sp-slab sp-slab--white" id="calNext" aria-label="Mois suivant">▶</button>
                    <button type="button" class="cal-today-btn sp-slab sp-slab--red" id="calToday">AUJOURD'HUI</button>
                </div>

                <div class="cal-weekdays" aria-hidden="true">
                    <span>LUN</span><span>MAR</span><span>MER</span><span>JEU</span><span>VEN</span><span class="we">SAM</span><span class="we">DIM</span>
                </div>
                <div class="cal-grid" id="calGrid" role="group" aria-label="Jours du mois"></div>

                <div class="cal-stats">
                    <div class="cal-stat"><b id="calStatDays">0</b><span>JOURS OUVRÉS</span></div>
                    <div class="cal-stat"><b id="calStatHours">0H</b><span>HEURES</span></div>
                    <div class="cal-stat cal-stat--red"><b id="calStatAmount">0 €</b><span>NET MAX DU MOIS</span></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Intro « changement de jour » -->
    <div class="cal-intro" id="calIntro" aria-hidden="true">
        <div class="cal-intro-prev"><span id="calIntroPrev">--</span><s></s></div>
        <div class="cal-intro-next"><em id="calIntroDow">—</em><span id="calIntroNext">--</span></div>
        <div class="cal-intro-slash"></div>
    </div>

    <script src="../shared/shared.js" defer></script>
    <script src="calendar-engine.js" defer></script>
    <script src="calendar-ui.js" defer></script>
</body>
</html>
