<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Salary Pulse — Menu principal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;800&family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="mm" data-sp-page="menu" data-sp-bg="custom">

    <!-- Fond : 7 couches, aucune boucle DOM (gradients, pseudo-éléments, 1 SVG) -->
    <div class="mm-bg" aria-hidden="true">
        <div class="mm-layer mm-red"></div>
        <div class="mm-layer mm-halftone"></div>
        <div class="mm-layer mm-diag"></div>
        <div class="mm-layer mm-burst"></div>
        <svg class="mm-layer mm-geo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
            <g fill="none" stroke-linejoin="round">
                <polygon points="1180,90 1290,90 1235,190" stroke="#f5f5f0" stroke-width="5"/>
                <polygon points="150,640 230,700 150,760" stroke="#f5f5f0" stroke-width="4" opacity=".5"/>
                <circle cx="1430" cy="700" r="70" stroke="#050505" stroke-width="10"/>
                <circle cx="1430" cy="700" r="38" stroke="#f5f5f0" stroke-width="4"/>
                <circle cx="620" cy="110" r="26" stroke="#f5f5f0" stroke-width="4" opacity=".55"/>
                <path d="M980 800h60M1010 770v60" stroke="#f5f5f0" stroke-width="6"/>
                <path d="M40 300h44M62 278v44" stroke="#e50914" stroke-width="6"/>
                <rect x="1320" y="300" width="60" height="60" stroke="#f5f5f0" stroke-width="4" opacity=".45" transform="rotate(18 1350 330)"/>
            </g>
            <text x="1120" y="470" class="mm-euro" font-size="240" transform="rotate(-8 1120 470)">€</text>
        </svg>
        <div class="mm-layer mm-ghost">PULSE</div>
        <svg class="mm-layer mm-ecg" viewBox="0 0 1600 120" preserveAspectRatio="none">
            <path pathLength="1000" d="M0 70H520L560 70L590 20L640 110L672 70H720L748 44L776 70H1600"/>
        </svg>
        <div class="mm-layer mm-vignette"></div>
    </div>

    <main class="mm-stage" id="mmStage">
        <h1 class="sp-sr-only">Salary Pulse — choisis un module</h1>

        <!-- HUD : sticker date/heure (haut gauche) + statut/SFX (haut droite) -->
        <header class="mm-hud" data-sp-header="menu"></header>

        <!-- Illustration secondaire : remplacer art/figure.svg (ou le src) pour intégrer un visuel final -->
        <img class="mm-figure" src="art/figure.svg" alt="" width="500" height="700" decoding="async">

        <!-- Identité -->
        <div class="mm-brand" aria-hidden="true">
            <span class="mm-brand-kicker">◆ COMMAND INTERFACE // V3</span>
            <span class="mm-brand-title">
                <span class="mm-b1">SALARY</span>
                <span class="mm-b2">PULSE</span>
            </span>
        </div>

        <!-- Commandes -->
        <nav class="mm-nav" id="mmNav" aria-label="Modules Salary Pulse">
            <span class="mm-pointer" id="mmPointer" aria-hidden="true"><span class="mm-pointer-star"></span></span>

            <a class="mm-cmd mm-dashboard" href="../dashboard-salary/" data-index="0" style="--r:-4deg">
                <span class="mm-slab" aria-hidden="true"></span>
                <span class="mm-num" aria-hidden="true">01</span>
                <span class="mm-label">
                    <span class="mm-l1">DASHBOARD</span>
                    <span class="mm-l2">SALARY</span>
                </span>
                <span class="mm-rate-sticker" aria-hidden="true"><b id="mmRate">7.89</b><i>€ / H</i></span>
                <span class="mm-meta">
                    <span class="mm-chip mm-chip-live" id="mmLive"><span class="mm-dot" aria-hidden="true"></span><span id="mmLiveText">EN DIRECT</span></span>
                    <span class="mm-chip" id="mmMinute">+0.1315 € / MIN</span>
                </span>
            </a>

            <a class="mm-cmd mm-calendar" href="../calendar/" data-index="1" style="--r:3deg">
                <span class="mm-slab" aria-hidden="true"></span>
                <span class="mm-num" aria-hidden="true">02</span>
                <span class="mm-label"><span class="mm-l1">CALENDRIER</span></span>
                <span class="mm-tape" aria-hidden="true">JOURS OUVRÉS ◆ JOURS OUVRÉS ◆ JOURS OUVRÉS ◆ JOURS OUVRÉS</span>
                <span class="mm-meta"><span class="mm-chip">PLANNING // 35H</span></span>
            </a>

            <a class="mm-cmd mm-gta" href="../gta-countdown/" data-index="2" style="--r:-2.5deg">
                <span class="mm-slab" aria-hidden="true"></span>
                <span class="mm-num" aria-hidden="true">03</span>
                <span class="mm-label">
                    <span class="mm-l1">GTA 6</span>
                    <span class="mm-l2">COUNTDOWN</span>
                </span>
                <span class="mm-meta">
                    <span class="mm-chip" id="mmGtaCount">J-—</span>
                    <span class="mm-chip mm-chip-alt">19 NOV 2026</span>
                </span>
            </a>
        </nav>

        <!-- Aide de navigation -->
        <p class="mm-help" aria-hidden="true">
            <span><kbd>↑</kbd><kbd>↓</kbd> CHOISIR</span>
            <span><kbd>ENTER</kbd> OUVRIR</span>
            <span><kbd>ESC</kbd> MENU</span>
        </p>
    </main>

    <script src="../shared/shared.js" defer></script>
    <script src="../gta-countdown/config.js" defer></script>
    <script src="../gta-countdown/countdown-engine.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
