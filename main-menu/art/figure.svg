<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" fill="none">
  <!-- Silhouette originale « voleur d'élite » (placeholder d'illustration).
       Remplacer ce fichier, ou changer le src de .mm-figure, pour intégrer une illustration finale. -->
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.3" fill="#ffffff" fill-opacity=".16"/>
    </pattern>

    <!-- Toutes les formes noires : servent au contour blanc, à l'ombre dure et au remplissage -->
    <g id="sil">
      <!-- pans de manteau qui volent vers l'arrière -->
      <path d="M214 425 L150 436 L58 492 L112 500 L36 592 L124 556 L112 650 L196 540 L226 566 Z"/>
      <path d="M226 425 L302 425 L326 486 L298 528 L262 474 L238 530 L214 470 Z"/>
      <!-- jambes en foulée -->
      <path d="M236 470 L272 470 L262 560 L236 648 L194 648 L216 560 Z"/>
      <path d="M186 646 L240 642 L246 672 L162 678 Z"/>
      <path d="M268 465 L314 470 L338 560 L376 636 L340 652 L296 572 Z"/>
      <path d="M336 634 L392 628 L402 660 L326 668 Z"/>
      <!-- torse + cols relevés -->
      <path d="M176 242 L236 228 L284 222 L334 246 L340 302 L324 424 L214 432 L190 332 Z"/>
      <path d="M176 242 L142 208 L204 226 Z"/>
      <path d="M334 246 L378 214 L332 226 Z"/>
      <!-- bras gauche (main sur la hanche) -->
      <path d="M180 248 L216 244 L198 300 L170 340 L204 380 L186 398 L138 346 Z"/>
      <!-- bras tendu qui présente la pièce -->
      <path d="M326 252 L362 264 L424 262 L474 234 L486 262 L424 298 L354 302 L326 290 Z"/>
      <!-- cou + tête -->
      <path d="M238 214 L274 208 L280 244 L234 250 Z"/>
      <path d="M212 150 L218 196 L252 224 L290 202 L302 150 L282 132 L240 130 Z"/>
      <!-- cheveux en épines -->
      <path d="M194 158 L182 120 L206 112 L192 74 L232 92 L246 50 L270 88 L306 62 L298 104 L334 116 L310 142 L302 162 L282 128 L240 126 L214 162 Z"/>
    </g>
  </defs>

  <!-- ombre portée dure -->
  <use href="#sil" transform="translate(16 16)" fill="#000" fill-opacity=".55"/>
  <!-- contour « autocollant » blanc -->
  <use href="#sil" fill="#f5f5f0" stroke="#f5f5f0" stroke-width="20" stroke-linejoin="round"/>
  <!-- remplissage noir -->
  <use href="#sil" fill="#050505"/>

  <!-- trame sur le manteau -->
  <path d="M176 242 L236 228 L284 222 L334 246 L340 302 L324 424 L214 432 L190 332 Z" fill="url(#dots)"/>
  <path d="M214 425 L150 436 L58 492 L112 500 L36 592 L124 556 L112 650 L196 540 L226 566 Z" fill="url(#dots)"/>

  <!-- doublure rouge des pans -->
  <path d="M178 452 L90 502 L128 510 L70 574 L152 546 L206 500 Z" fill="#e50914"/>
  <path d="M256 470 L282 526 L298 500 L312 486 L296 470 Z" fill="#e50914"/>

  <!-- écharpe rouge qui flotte -->
  <path d="M236 228 L154 240 L76 212 L38 244 L112 266 L196 266 Z" fill="#e50914" stroke="#050505" stroke-width="4" stroke-linejoin="round"/>
  <path d="M112 266 L84 296 L136 282 Z" fill="#e50914" stroke="#050505" stroke-width="3" stroke-linejoin="round"/>

  <!-- chemise blanche + revers -->
  <path d="M242 230 L268 232 L262 318 L246 302 Z" fill="#f5f5f0"/>
  <path d="M236 228 L216 262 L232 336 L250 300 Z" fill="#e50914"/>
  <path d="M286 224 L266 232 L262 318 L284 340 L312 300 L332 250 Z" fill="#e50914"/>
  <path d="M236 228 L216 262 L232 336 M286 224 L310 296 L284 340" stroke="#f5f5f0" stroke-width="3" stroke-linejoin="round"/>

  <!-- gants blancs -->
  <path d="M472 232 L494 248 L486 272 L462 262 Z" fill="#f5f5f0" stroke="#050505" stroke-width="3" stroke-linejoin="round"/>
  <path d="M176 384 L204 380 L208 404 L184 412 Z" fill="#f5f5f0" stroke="#050505" stroke-width="3" stroke-linejoin="round"/>

  <!-- pièce lancée : étoile blanche à cœur rouge -->
  <g transform="translate(478 196) rotate(14)">
    <polygon points="0,-34 9,-11 34,-11 14,4 21,29 0,14 -21,29 -14,4 -34,-11 -9,-11" fill="#f5f5f0" stroke="#050505" stroke-width="4" stroke-linejoin="round"/>
    <circle r="9" fill="#e50914" stroke="#050505" stroke-width="3"/>
  </g>

  <!-- visage -->
  <path d="M214 156 L220 196 L252 222 L288 200 L300 156 Z" fill="#f5f5f0"/>
  <!-- masque rouge angulaire + fentes -->
  <path d="M206 152 L304 148 L298 182 L270 174 L252 190 L234 174 L212 184 Z" fill="#e50914" stroke="#050505" stroke-width="4" stroke-linejoin="round"/>
  <path d="M220 158 L246 163 L240 173 L222 170 Z" fill="#f5f5f0"/>
  <path d="M264 164 L292 158 L289 170 L268 173 Z" fill="#f5f5f0"/>
  <!-- sourire en biais -->
  <path d="M238 202 L272 196 L266 206 L248 208 Z" fill="#050505"/>
  <!-- reflets de cheveux -->
  <path d="M200 150 L192 118 M236 118 L246 74 M276 112 L306 78" stroke="#f5f5f0" stroke-width="3" stroke-linecap="round"/>

  <!-- lumière de contour sur le manteau et les jambes -->
  <path d="M180 250 L194 332 L216 428 M336 254 L340 302 L326 420" stroke="#f5f5f0" stroke-width="3" stroke-linecap="round" stroke-opacity=".8"/>
  <path d="M242 480 L236 560 L214 640 M318 480 L338 556 L372 630" stroke="#f5f5f0" stroke-width="3" stroke-linecap="round" stroke-opacity=".6"/>
  <!-- semelles rouges -->
  <path d="M164 674 L246 668 L246 672 L162 678 Z M328 664 L402 656 L402 660 L326 668 Z" fill="#e50914"/>
</svg>
