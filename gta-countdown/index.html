<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Salary Pulse — GTA 6 Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/shared.css?v=20260919b">
    <link rel="stylesheet" href="gta.css?v=20260919b">
</head>
<body data-sp-page="gta" data-sp-hud="auto">
    <div class="sp-app-container">
        <header class="sp-header" data-sp-header="module"></header>

        <main class="gta-main">
            <!-- Calling card -->
            <article class="gta-card" id="gtaCard" aria-labelledby="gtaTitle">
                <div class="gta-stamp" aria-hidden="true">★</div>
                <p class="gta-tag">AVIS DE PASSAGE // <span id="gtaTitleState">SORTIE FRANCE</span></p>

                <h1 class="gta-title" id="gtaTitle" data-ransom>GTA 6</h1>

                <p class="gta-message" id="gtaMessage">VICE CITY VA CHANGER DE MAINS. ON VOLE VOTRE TEMPS LIBRE JUSQU'AU JOUR J.</p>

                <div class="gta-timer" role="timer" aria-label="Temps restant avant la sortie de GTA 6">
                    <div class="gta-unit"><b id="gtaDays">--</b><span>JOURS</span></div>
                    <i class="gta-sep" aria-hidden="true">/</i>
                    <div class="gta-unit"><b id="gtaHours">--</b><span>HEURES</span></div>
                    <i class="gta-sep" aria-hidden="true">/</i>
                    <div class="gta-unit"><b id="gtaMinutes">--</b><span>MINUTES</span></div>
                    <i class="gta-sep" aria-hidden="true">/</i>
                    <div class="gta-unit gta-unit--sec"><b id="gtaSeconds" class="sp-glitch">--</b><span>SECONDES</span></div>
                </div>

                <p class="gta-sign"><span>SORTIE FRANCE</span> <b id="gtaDate">—</b></p>
            </article>

            <a href="../main-menu/" class="gta-back sp-slab sp-slab--white" data-sp-back><span aria-hidden="true">◀</span> MENU PRINCIPAL [ESC]</a>
        </main>
    </div>

    <div class="gta-flash" id="gtaFlash" aria-hidden="true"></div>

    <script src="../shared/scheduleConfig.js?v=20260919b" defer></script>
    <script src="../shared/schedule-engine.js?v=20260919b" defer></script>
    <script src="../shared/shared.js?v=20260919b" defer></script>
    <script src="config.js?v=20260919b" defer></script>
    <script src="countdown-engine.js?v=20260919b" defer></script>
    <script src="gta-ui.js?v=20260919b" defer></script>
</body>
</html>
